version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "brandonlenz"
    allow:
      - dependency-type: direct
    groups:
      non-major:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "brandonlenz"
    groups:
      non-major:
        update-types: ["minor", "patch"]
